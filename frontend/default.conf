server {
    listen 80;
    server_name localhost;

    # Расположение для проксирования всех API запросов
    location /api/ {
        # 'backend' - это имя сервиса из docker-compose.dev.yml.
        # Docker обеспечивает разрешение этого имени в IP-адрес контейнера.
        proxy_pass http://backend:8000;

        # Стандартные заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Расположение для статических файлов фронтенда
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Эта строка важна для Single Page Applications (SPA)
        try_files $uri $uri/ /index.html;
    }
}